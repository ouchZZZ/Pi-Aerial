name: Apple live inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/apple_catalog.py'
      - 'app/apple_reconcile.py'
      - 'tools/apple_inventory.py'
      - '.github/workflows/apple-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Apple manifests (diagnostic only)
        run: python -m tools.apple_inventory
