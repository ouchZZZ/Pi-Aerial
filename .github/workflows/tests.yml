name: Pi Aerial tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app tools
      - name: Check shell syntax
        run: bash -n install.sh && bash -n tools/system_deps.sh
      - name: List allowed system dependencies
        run: bash tools/system_deps.sh --list
