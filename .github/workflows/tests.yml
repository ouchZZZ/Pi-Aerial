name: Pi Aerial tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Repeat full Python suite to catch cross-test worker leaks
        run: |
          for attempt in 1 2 3; do
            echo "Full pytest run ${attempt}/3"
            python -m pytest -q
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Display JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Check Python syntax
        run: python -m compileall -q app tools
      - name: Check shell syntax
        run: bash -n install.sh && bash -n tools/system_deps.sh
      - name: List allowed system dependencies
        run: bash tools/system_deps.sh --list
