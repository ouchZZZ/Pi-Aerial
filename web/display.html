<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Aerial · Экран</title>
<link rel="stylesheet" href="/assets/display.css"></head>
<body>
<div id="landscape" aria-hidden="true"><span class="glow"></span><span class="ridge a"></span><span class="ridge b"></span></div>
<video id="video" muted playsinline preload="auto"></video>
<div id="shade"></div><div id="nightShade"></div>
<div id="clockCard" class="clock-card">
  <div id="clock" class="clock">--:--</div>
  <div id="city" class="city"></div>
  <div id="weather" class="weather"><div class="wx-icon" id="wxIcon">◌</div><div class="wx-main"><span id="wxTemp">Погода загружается</span><small id="wxDetail"></small></div></div>
  <div id="forecast" class="forecast" aria-label="Прогноз на неделю" hidden></div>
</div>
<section id="calendarCard" class="calendar-card osd-right">
  <div id="weekday" class="weekday"></div>
  <div id="date" class="date"></div>
  <div id="monthGrid" class="month-grid"></div>
</section>
<div id="moduleLayer" class="module-layer"></div>
<div id="clipFooter" class="footer"><div class="clip-info"><span id="clipName">ЛОКАЛЬНЫЕ ВИДЕО</span><span id="clipDescription" hidden></span></div></div>
<script src="/assets/display.js" defer></script></body></html>
