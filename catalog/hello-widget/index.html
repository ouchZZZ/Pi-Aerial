<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;color:#fff;font:500 clamp(16px,2vw,29px) system-ui,sans-serif;text-shadow:0 2px 14px #0009}.label{border:1px solid #ffffff60;border-radius:16px;padding:18px;backdrop-filter:blur(8px);background:#101d2875;text-align:center}small{display:block;color:#ffffffc4;font-size:.55em;padding-top:10px}</style></head><body><div class="label"><span id="message">Добро пожаловать!</span><small id="sub">PI AERIAL · МОДУЛЬ</small></div><script>
window.addEventListener('message',event=>{if(event.data?.type!=='aerial:data')return;const hour=new Date().getHours();document.getElementById('message').textContent=hour<12?'Доброе утро!':hour<18?'Хорошего дня!':'Приятного вечера!';document.getElementById('sub').textContent='СИСТЕМА РАБОТАЕТ';});
</script></body></html>
